# Builds the skybox generator image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/skyboxsystem:latest      <- default branch
#   ghcr.io/<owner>/skyboxsystem:<branch>    <- any other branch
#   ghcr.io/<owner>/skyboxsystem:<version>   <- tags like v1.2.0
#   ghcr.io/<owner>/skyboxsystem:sha-<sha>   <- every build
# Then it smoke-tests the pushed image on the (GPU-less) runner: all ML imports + a full
# API/queue round trip with the mock pipeline.

name: Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "app/**"
      - "tools/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the CUDA + PyTorch image needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the pushed image
        run: |
          echo "REF=$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          docker pull "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: "Smoke test: every ML dependency imports"
        run: |
          docker run --rm -i -e AUTH_DISABLED=true "$REF" python - <<'EOF'
          import torch, torchvision, diffusers, transformers, bitsandbytes, peft, accelerate, spandrel, cv2, scipy
          import utils3d_moge
          from moge.model.v2 import MoGeModel
          from moge.utils.panorama import get_panorama_cameras, split_panorama_image, merge_panorama_depth
          from transformers import AutoModelForSemanticSegmentation, Qwen3VLForConditionalGeneration
          from diffusers import FluxInpaintPipeline, FluxPipeline, FluxPriorReduxPipeline
          import app.main, app.pipeline.skybox
          print(f"torch {torch.__version__} (CUDA {torch.version.cuda}) | diffusers {diffusers.__version__} | "
                f"transformers {transformers.__version__} | bitsandbytes {bitsandbytes.__version__}")
          EOF

      - name: "Smoke test: API + queue round trip (mock pipeline)"
        run: |
          docker run -d --name skybox -p 8000:8000 -e API_KEYS=ci -e MOCK_PIPELINE=true -e OUT_WIDTH=1024 "$REF"
          for i in $(seq 1 60); do curl -fs http://localhost:8000/health && break; sleep 2; done
          echo
          docker exec skybox python -c "from PIL import Image; Image.new('RGB', (320, 200), (90, 140, 200)).save('/tmp/in.png')"
          docker exec skybox python tools/client.py --url http://localhost:8000 --key ci /tmp/in.png --out /tmp/results
          docker exec skybox sh -c 'ls -l /tmp/results/*/'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/jobs)" = "401"

      - name: Container logs
        if: always()
        run: docker logs skybox 2>&1 | tail -50 || true
